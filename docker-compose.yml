services:
  redman:
    build: .
    container_name: redman
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${REDMAN_WEB_BIND:-127.0.0.1}:${REDMAN_WEB_PORT:-8090}:8090"
    volumes:
      - ${REDMAN_DATA_PATH:?Set the existing RedMan host app-data path}:/app/backend/data
    environment:
      - NODE_ENV=production
      - REDMAN_UPGRADE_BRIDGE=true
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:?Set the exact reverse-proxy source IP}
      - REDMAN_ADMIN_GROUP=${REDMAN_ADMIN_GROUP:-admins}
      - REDMAN_ADMIN_ROLE=${REDMAN_ADMIN_ROLE:-}
      - PORT=8090
      - PEER_API_PORT=8091
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped
